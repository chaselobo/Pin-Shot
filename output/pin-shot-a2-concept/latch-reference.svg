<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect width="800" height="560" fill="#ffffff"/>
  <text x="32" y="44" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#151612" letter-spacing="1">PIN + LATCH DETAIL · FRONT VIEW</text>

  <!-- bottle shoulder -->
  
  <rect x="110" y="420" width="420" height="16" fill="#e4e7e2"/>

  <!-- lid -->
  <rect x="84" y="70" width="470" height="70" rx="22" fill="#4b4d4b"/>
  <rect x="120" y="82" width="390" height="8" rx="4" fill="#ffffff" opacity=".12"/>
  <!-- hinge on left -->
  <rect x="62" y="110" width="28" height="30" rx="6" fill="#2f302f"/>

  <!-- ribbed window -->
  <rect x="96" y="140" width="446" height="192" fill="#8d908c"/>
  <rect x="140" y="170" width="358" height="150" rx="10" fill="#d9dcd8" opacity=".75"/>
  <g stroke="#5f625e" stroke-width="5">
    <line x1="118" y1="146" x2="118" y2="326"/><line x1="148" y1="146" x2="148" y2="326"/><line x1="178" y1="146" x2="178" y2="326"/>
    <line x1="208" y1="146" x2="208" y2="326"/><line x1="238" y1="146" x2="238" y2="326"/><line x1="268" y1="146" x2="268" y2="326"/>
    <line x1="298" y1="146" x2="298" y2="326"/><line x1="328" y1="146" x2="328" y2="326"/><line x1="358" y1="146" x2="358" y2="326"/>
    <line x1="388" y1="146" x2="388" y2="326"/><line x1="418" y1="146" x2="418" y2="326"/><line x1="448" y1="146" x2="448" y2="326"/>
    <line x1="478" y1="146" x2="478" y2="326"/><line x1="508" y1="146" x2="508" y2="326"/>
  </g>

  <!-- lower dark band -->
  <rect x="96" y="332" width="446" height="90" fill="#2b2c2b"/>

  <!-- latch tab: one piece with lid, runs down the right side to the lower band -->
  <path d="M542 96 H572 Q584 96 584 108 V346 H594 Q602 346 602 354 V398 Q602 410 590 410 H550 Q542 410 542 402 Z" fill="#141514"/>
  <rect x="548" y="104" width="6" height="230" rx="3" fill="#ffffff" opacity=".08"/>

  <!-- pin: straight horizontal stem through the tab foot -->
  <ellipse cx="602" cy="377" rx="4" ry="11" fill="#000000" opacity=".5"/>
  <rect x="600" y="368" width="60" height="18" rx="4" fill="#e0662a"/>
  <rect x="600" y="370" width="60" height="5" rx="2" fill="#ffffff" opacity=".25"/>
  <circle cx="712" cy="377" r="54" fill="none" stroke="#e0662a" stroke-width="15"/>

  <!-- callouts -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#151612">
    <line x1="596" y1="196" x2="640" y2="196" stroke="#151612" stroke-width="1.5"/>
    <circle cx="586" cy="196" r="4" fill="#151612"/>
    <text x="648" y="190" font-size="15" font-weight="700">LATCH TAB</text>
    <text x="648" y="210" font-size="13">part of the lid, runs down</text>
    <text x="648" y="226" font-size="13">to the dark lower band</text>

    <line x1="630" y1="392" x2="630" y2="458" stroke="#151612" stroke-width="1.5"/>
    <circle cx="630" cy="392" r="4" fill="#151612"/>
    <text x="440" y="482" font-size="15" font-weight="700">STRAIGHT, HORIZONTAL STEM</text>
    <text x="440" y="502" font-size="13">goes through the foot of the tab into the cap.</text>
    <text x="440" y="520" font-size="13">No bend, no vertical orange section.</text>
  </g>
</svg>
